<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理门户 - NapCat WordLib Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root {
  --bg-page: #f4f7f9;
  --bg-card: #fff;
  --text-primary: #1f2733;
  --text-regular: #4a5568;
  --text-secondary: #8a94a6;
  --border-color: #e4e9f0;
  --color-primary: #6495ed;
  --color-primary-light: #91b9fa;
  --color-primary-dark: #4a71c7;
  --shadow: 0 8px 32px rgba(74,113,199,.14);
  --radius: 16px;
  --bg-grad: linear-gradient(135deg, #eef3fb 0%, #dfe9fa 50%, #e8effb 100%);
}
[data-theme="dark"] {
  --bg-page: #2c344a;
  --bg-card: #3a4256;
  --text-primary: #e8ecf4;
  --text-regular: #c3cad9;
  --text-secondary: #8f99b0;
  --border-color: #4a5470;
  --shadow: 0 8px 32px rgba(0,0,0,.4);
  --bg-grad: linear-gradient(135deg, #232b3d 0%, #2c344a 50%, #263044 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg-grad); color: var(--text-primary);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  transition: background .3s; overflow: hidden; position: relative;
}
/* 背景装饰光斑 */
.bg-deco { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .5; pointer-events: none; z-index: 0; }
.bg-deco.d1 { width: 420px; height: 420px; background: #91b9fa; top: -120px; left: -100px; animation: float1 12s ease-in-out infinite; }
.bg-deco.d2 { width: 360px; height: 360px; background: #a78bfa; bottom: -100px; right: -80px; animation: float2 15s ease-in-out infinite; }
.bg-deco.d3 { width: 240px; height: 240px; background: #67c23a; opacity: .25; top: 50%; left: 60%; animation: float1 18s ease-in-out infinite reverse; }
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-30px) scale(1.08); } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,30px) scale(1.05); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }

.login-wrap {
  position: relative; z-index: 1; display: flex; width: 900px; max-width: 94%;
  min-height: 520px; border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--border-color);
  background: var(--bg-card);
}
/* 左侧品牌区 */
.brand-panel {
  flex: 1.1; padding: 52px 44px; display: flex; flex-direction: column; justify-content: center;
  background: linear-gradient(160deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #fff; animation: fadeUp .5s ease both;
}
.brand-panel .brand-logo {
  width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 34px;
  margin-bottom: 22px; box-shadow: 0 8px 20px rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.2);
}
.brand-panel h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: .5px; }
.brand-panel .brand-sub { font-size: 13px; opacity: .85; margin-bottom: 32px; }
.brand-features { display: flex; flex-direction: column; gap: 14px; }
.brand-feature { display: flex; align-items: center; gap: 12px; font-size: 13.5px; opacity: .95; }
.brand-feature .bf-icon {
  width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.brand-panel .brand-footer { margin-top: 36px; font-size: 12px; opacity: .6; }

/* 右侧表单区 */
.form-panel { flex: 1; padding: 52px 46px; display: flex; flex-direction: column; justify-content: center; animation: fadeUp .5s ease .08s both; }
.form-panel .fp-title { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
.form-panel .fp-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 30px; }
.input-group { position: relative; margin-bottom: 16px; }
.input-group .input-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 15px; opacity: .55; pointer-events: none;
}
.input-group input {
  width: 100%; padding: 13px 16px 13px 42px; border: 1px solid var(--border-color);
  border-radius: 11px; font-size: 14px; outline: none; transition: all .2s;
  background: var(--bg-input, #f2f5fa); color: var(--text-primary);
}
.input-group input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(100,149,237,.16); background: var(--bg-card); }
.btn-login {
  width: 100%; padding: 13px; border: none; border-radius: 11px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all .2s; box-shadow: 0 4px 14px rgba(100,149,237,.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:hover { box-shadow: 0 6px 20px rgba(100,149,237,.5); transform: translateY(-1px); }
.btn-login:active { transform: scale(.97); }
.btn-login:disabled { opacity: .7; cursor: not-allowed; transform: none; }
.btn-login .spin {
  width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
  border-radius: 50%; display: none; animation: spin .7s linear infinite;
}
.btn-login.loading .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.login-error { color: #ed6f6f; font-size: 13px; min-height: 22px; margin-top: 12px; text-align: center; }
.form-footer { margin-top: 22px; padding: 12px 16px; border-radius: 11px; background: rgba(100,149,237,.08); font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 12px; }
.form-footer span { display: flex; align-items: center; gap: 4px; }

.theme-btn {
  position: fixed; top: 16px; right: 16px; width: 38px; height: 38px; z-index: 5;
  border-radius: 50%; border: 1px solid var(--border-color);
  background: var(--bg-card); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
}

/* 实例选择（多实例） */
.bots-card { display: none; position: relative; z-index: 1; width: 480px; max-width: 94%; background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border-color); padding: 40px 36px; animation: fadeUp .4s ease both; }
.bots-card .bc-title { text-align: center; font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.bots-card .bc-sub { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 26px; }
.instance-card {
  background: var(--bg-card); border-radius: 13px; box-shadow: 0 3px 12px rgba(74,113,199,.08);
  padding: 16px 20px; margin-bottom: 12px; cursor: pointer; border: 1px solid var(--border-color);
  transition: all .18s; display: flex; align-items: center; justify-content: space-between;
}
.instance-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(74,113,199,.16); border-color: var(--color-primary); }
.instance-card .ic-name { font-size: 15px; font-weight: 600; }
.instance-card .ic-qq { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.instance-card .ic-status { font-size: 13px; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
.ic-status.on { background: rgba(103,194,58,.15); color: #67c23a; }
.ic-status.off { background: rgba(245,108,108,.12); color: #ed6f6f; }
.bots-back { text-align: center; margin-top: 14px; font-size: 13px; color: var(--color-primary); cursor: pointer; }

@media (max-width: 768px) {
  .brand-panel { display: none; }
  .form-panel { padding: 44px 32px; }
}
</style>
</head>
<body>
<div class="bg-deco d1"></div>
<div class="bg-deco d2"></div>
<div class="bg-deco d3"></div>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>

<!-- 登录区：左侧品牌 + 右侧表单 -->
<div class="login-wrap" id="loginCard">
  <div class="brand-panel">
    <div class="brand-logo">🤖</div>
    <h1>NapCat WordLib Bot</h1>
    <p class="brand-sub">基于 NapCat 的 QQ 机器人管理框架</p>
    <div class="brand-features">
      <div class="brand-feature"><span class="bf-icon">🧩</span> 插件化架构，热加载即用</div>
      <div class="brand-feature"><span class="bf-icon">🖥️</span> Web 管理面板，可视化配置</div>
      <div class="brand-feature"><span class="bf-icon">📦</span> 多实例独立部署互不干扰</div>
      <div class="brand-feature"><span class="bf-icon">🔌</span> 插件仓库一键安装更新</div>
    </div>
    <div class="brand-footer">v1.1.0 · github.com/Bdlxx/NapCat-WordLibBot</div>
  </div>
  <div class="form-panel">
    <div class="fp-title">欢迎回来 👋</div>
    <p class="fp-sub">请输入管理密码进入面板</p>
    <div class="input-group">
      <span class="input-icon">🔑</span>
      <input type="password" id="passwordInput" placeholder="输入管理密码" autofocus>
    </div>
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      <span class="spin"></span><span id="loginBtnText">进入管理面板</span>
    </button>
    <div class="login-error" id="errorMsg"></div>
    <div class="form-footer"><span>⭐ 依星</span><span>🪶 羽笙</span><span>🌐 多实例</span></div>
  </div>
</div>

<!-- 实例选择（多实例） -->
<div class="bots-card" id="botsCard">
  <div class="bc-title">选择要管理的机器人</div>
  <div class="bc-sub">检测到多个实例</div>
  <div id="botsList"></div>
  <div class="bots-back" onclick="backToLogin()">← 返回重新输入密码</div>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
}
const saved = localStorage.getItem('theme');
if (saved === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('themeBtn').textContent = '☀️'; }

function botPath(name) {
  // 通用面板路径（实例通过 ?bot=N 切换，仓库不内置具体实例页面）
  return '/panel/';
}

async function showBots(redirect) {
  try {
    const r = await fetch('/api/bots');
    const d = await r.json();
    const bots = d.bots || [];
    if (bots.length <= 1) {
      if (bots.length === 1) { window.location.href = botPath(bots[0].name) + '?bot=' + bots[0].num; }
      else if (redirect) { window.location.href = redirect; }
      return;
    }
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('botsCard').style.display = 'block';
    const list = document.getElementById('botsList');
    list.innerHTML = '';
    for (const b of bots) {
      const card = document.createElement('div');
      card.className = 'instance-card';
      card.onclick = () => { window.location.href = botPath(b.name) + '?bot=' + b.num; };
      card.innerHTML =
        '<div><div class="ic-name">🤖 ' + b.name + '</div>' +
        '<div class="ic-qq">QQ: ' + (b.qq || '-') + '</div></div>' +
        '<div class="ic-status ' + (b.running ? 'on' : 'off') + '">' + (b.running ? '● 运行中' : '○ 未运行') + '</div>';
      list.appendChild(card);
    }
  } catch(e) { if (redirect) { window.location.href = redirect; } }
}

function backToLogin() {
  document.getElementById('botsCard').style.display = 'none';
  document.getElementById('loginCard').style.display = '';
}

async function handleLogin() {
  const pwd = document.getElementById('passwordInput').value.trim();
  const err = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');
  if (!pwd) { err.textContent = '请输入密码'; return; }
  // 加载态
  btn.classList.add('loading'); btn.disabled = true;
  document.getElementById('loginBtnText').textContent = '登录中...';
  try {
    const r = await fetch('/api/portal-login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) });
    const d = await r.json();
    if (d.success && d.redirect) { await showBots(d.redirect); }
    else {
      err.textContent = '密码错误，请重试';
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
      setTimeout(() => err.textContent = '', 2000);
    }
  } catch(e) { err.textContent = '登录服务异常，请稍后重试'; }
  finally {
    btn.classList.remove('loading'); btn.disabled = false;
    document.getElementById('loginBtnText').textContent = '进入管理面板';
  }
}
document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
});
</script>
</body>
</html>
