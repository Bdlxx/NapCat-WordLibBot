<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理门户 - NapCat WordLib Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root {
  --bg-page: #f4f7f9;
  --bg-card: #fff;
  --text-primary: #1f2733;
  --text-regular: #4a5568;
  --text-secondary: #8a94a6;
  --border-color: #e4e9f0;
  --color-primary: #6495ed;
  --color-primary-light: #91b9fa;
  --color-primary-dark: #4a71c7;
  --shadow: 0 6px 24px rgba(74,113,199,.12);
  --radius: 14px;
  --bg-grad: linear-gradient(135deg, #eef3fb 0%, #dfe9fa 50%, #e8effb 100%);
}
[data-theme="dark"] {
  --bg-page: #2c344a;
  --bg-card: #3a4256;
  --text-primary: #e8ecf4;
  --text-regular: #c3cad9;
  --text-secondary: #8f99b0;
  --border-color: #4a5470;
  --color-primary: #6495ed;
  --color-primary-light: #91b9fa;
  --color-primary-dark: #4a71c7;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
  --bg-grad: linear-gradient(135deg, #232b3d 0%, #2c344a 50%, #263044 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  background: var(--bg-grad); color: var(--text-primary);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  transition: background .3s;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.login-card {
  background: var(--bg-card); border-radius: var(--radius);
  box-shadow: var(--shadow); width: 400px; max-width: 92%;
  padding: 44px 36px; text-align: center;
  border: 1px solid var(--border-color);
  animation: fadeUp .5s ease both;
}
.login-card .logo { font-size: 52px; margin-bottom: 10px; }
.login-card h1 {
  font-size: 21px; font-weight: 700; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--color-primary), #a78bfa 60%, #6495ed);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-card .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 30px; }
.login-card input {
  width: 100%; padding: 13px 16px; border: 1px solid var(--border-color);
  border-radius: 10px; font-size: 14px; outline: none; transition: all .2s;
  background: var(--bg-card); color: var(--text-primary);
  margin-bottom: 16px;
}
.login-card input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(100,149,237,.18); }
.login-card .btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s; box-shadow: 0 4px 14px rgba(100,149,237,.35);
}
.login-card .btn:hover { background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary)); box-shadow: 0 6px 18px rgba(100,149,237,.45); transform: translateY(-1px); }
.login-card .btn:active { transform: scale(.97); }
.login-card .error { color: #ed6f6f; font-size: 13px; min-height: 24px; margin-top: 12px; }
.login-card .hint {
  margin-top: 22px; padding: 12px 16px; border-radius: 10px;
  background: rgba(100,149,237,.08); font-size: 12px; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.login-card .hint span { display: flex; align-items: center; gap: 4px; }
.theme-btn {
  position: fixed; top: 16px; right: 16px; width: 36px; height: 36px;
  border-radius: 50%; border: 1px solid var(--border-color);
  background: var(--bg-card); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
}
.instance-card {
  background: var(--bg-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 22px; margin-bottom: 12px;
  cursor: pointer; border: 1px solid var(--border-color);
  transition: transform .15s, box-shadow .15s; display: flex;
  align-items: center; justify-content: space-between; min-width: 360px;
  max-width: 100%;
}
.instance-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.instance-card .ic-name { font-size: 16px; font-weight: 600; }
.instance-card .ic-qq { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.instance-card .ic-status { font-size: 13px; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
.ic-status.on { background: rgba(103,194,58,.15); color: #67c23a; }
.ic-status.off { background: rgba(245,108,108,.12); color: #f56c6c; }
.bots-title { text-align: center; font-size: 17px; font-weight: 600; margin-bottom: 16px; }
.bots-back { text-align: center; margin-top: 14px; font-size: 13px; color: var(--color-primary); cursor: pointer; }
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
<div class="login-card" id="loginCard">
  <div class="logo">🤖</div>
  <h1>NapCat WordLib Bot</h1>
  <p class="subtitle">请输入密码进入管理面板</p>
  <input type="password" id="passwordInput" placeholder="输入密码" autofocus>
  <button class="btn" onclick="handleLogin()">进入管理面板</button>
  <div class="error" id="errorMsg"></div>
  <div class="hint">
    <span>⭐ 依星</span><span>🪶 羽笙</span>
  </div>
</div>
<div class="login-card" id="botsCard" style="display:none">
  <div class="logo">🤖</div>
  <h1>NapCat WordLib Bot</h1>
  <p class="subtitle">检测到多个实例，请选择要管理的机器人</p>
  <div id="botsList"></div>
  <div class="bots-back" onclick="backToLogin()">← 返回重新输入密码</div>
</div>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
}
const saved = localStorage.getItem('theme');
if (saved === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('themeBtn').textContent = '☀️'; }

function botPath(name) {
  // 通用面板路径（实例通过 ?bot=N 切换，仓库不内置具体实例页面）
  return '/panel/';
}

async function showBots(redirect) {
  try {
    const r = await fetch('/api/bots');
    const d = await r.json();
    const bots = d.bots || [];
    if (bots.length <= 1) {
      if (bots.length === 1) { window.location.href = botPath(bots[0].name) + '?bot=' + bots[0].num; }
      else if (redirect) { window.location.href = redirect; }
      return;
    }
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('botsCard').style.display = '';
    const list = document.getElementById('botsList');
    list.innerHTML = '';
    for (const b of bots) {
      const card = document.createElement('div');
      card.className = 'instance-card';
      card.onclick = () => { window.location.href = botPath(b.name) + '?bot=' + b.num; };
      card.innerHTML =
        '<div><div class="ic-name">🤖 ' + b.name + '</div>' +
        '<div class="ic-qq">QQ: ' + (b.qq || '-') + '</div></div>' +
        '<div class="ic-status ' + (b.running ? 'on' : 'off') + '">' + (b.running ? '● 运行中' : '○ 未运行') + '</div>';
      list.appendChild(card);
    }
  } catch(e) { if (redirect) { window.location.href = redirect; } }
}

function backToLogin() {
  document.getElementById('botsCard').style.display = 'none';
  document.getElementById('loginCard').style.display = '';
}

async function handleLogin() {
  const pwd = document.getElementById('passwordInput').value.trim();
  const err = document.getElementById('errorMsg');
  if (!pwd) { err.textContent = '请输入密码'; return; }
  try {
    const r = await fetch('/api/portal-login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) });
    const d = await r.json();
    if (d.success && d.redirect) { await showBots(d.redirect); }
    else { err.textContent = '密码错误，请重试'; document.getElementById('passwordInput').value = ''; setTimeout(() => err.textContent = '', 2000); }
  } catch(e) { err.textContent = '登录服务异常，请稍后重试'; }
}
document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
});
</script>
</body>
</html>
