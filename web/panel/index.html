<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机器人管理面板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root {
  --bg-page: #f4f7f9; --bg-sidebar: #fff; --bg-header: #fff; --bg-card: #fff;
  --bg-input: #f2f5fa; --bg-hover: #eef3fb; --bg-active: #e8f0fd;
  --text-primary: #1f2733; --text-regular: #4a5568; --text-secondary: #8a94a6;
  --border-color: #e4e9f0; --border-light: #eef2f7;
  --color-primary: #6495ed; --color-primary-light: #91b9fa; --color-primary-dark: #4a71c7;
  --color-success: #67c23a; --color-warning: #e6a23c; --color-danger: #ed6f6f;
  --shadow-card: 0 4px 16px 0 rgba(74,113,199,.08);
  --radius: 8px; --radius-lg: 12px; --sidebar-width: 220px;
}
[data-theme="dark"] {
  --bg-page: #2c344a; --bg-sidebar: #333c52; --bg-header: #333c52; --bg-card: #3a4256;
  --bg-input: #444e66; --bg-hover: #3d4760; --bg-active: #3b4a70;
  --text-primary: #e8ecf4; --text-regular: #c3cad9; --text-secondary: #8f99b0;
  --border-color: #4a5470; --border-light: #3f4a64;
  --shadow-card: 0 4px 16px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;font-size:14px;color:var(--text-primary);background:var(--bg-page);-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-width);background:var(--bg-sidebar);border-right:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sidebar-logo{padding:18px 16px;font-size:16px;font-weight:700;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:8px}
.sidebar-logo .logo-text{color:var(--color-primary)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px}
.nav-group-title{padding:14px 16px 6px;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:var(--text-regular);transition:all .2s;border-left:3px solid transparent;margin:2px 0;font-size:13px;border-radius:0 8px 8px 0;margin-right:8px}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(90deg,rgba(100,149,237,.14),rgba(100,149,237,.03));color:var(--color-primary);border-left-color:var(--color-primary);font-weight:600}
.nav-item.active .icon{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;box-shadow:0 3px 8px rgba(100,149,237,.35)}
.nav-arrow{margin-left:auto;font-size:10px;color:var(--text-secondary);transition:transform .2s}
.nav-sub{display:none;padding:2px 0 8px 30px}
.nav-sub-item{padding:7px 12px;font-size:12px;color:var(--text-regular);cursor:pointer;border-radius:6px;margin:1px 8px 1px 0;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub-item:hover{background:var(--bg-hover);color:var(--color-primary)}
.nav-sub-item.active{background:var(--bg-active);color:var(--color-primary);font-weight:600}
.nav-sub-loading{padding:6px 12px;font-size:12px;color:var(--text-secondary)}
.nav-item .icon{font-size:15px;width:28px;height:28px;border-radius:8px;background:var(--bg-input);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.nav-item:hover .icon{background:var(--bg-hover);transform:scale(1.05)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.header{background:var(--bg-header);border-bottom:1px solid var(--border-color);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header-breadcrumb{font-size:14px;color:var(--text-secondary)}
.header-breadcrumb .current{color:var(--text-primary);font-weight:500}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.el-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500}
.el-tag.success{background:rgba(103,194,58,.15);color:var(--color-success)}
.el-tag.danger{background:rgba(245,108,108,.15);color:var(--color-danger)}
.el-tag.warning{background:rgba(230,162,60,.15);color:var(--color-warning)}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.status-dot.green{background:var(--color-success)}
.status-dot.red{background:var(--color-danger)}
.status-dot.yellow{background:var(--color-warning);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-input);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-regular);transition:all .2s}
.theme-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.header-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-input);cursor:pointer;font-size:12px;color:var(--text-regular);transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.header-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.content{flex:1;overflow-y:auto;padding:20px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}
.card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid var(--border-light);margin-bottom:16px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-header h3::before{content:'';width:4px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--color-primary),var(--color-primary-light))}
.card-body{padding:16px 20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-card);border:1px solid var(--border-light);display:flex;align-items:flex-start;gap:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-primary)}
.stat-card:has(.stat-icon.green)::before{background:var(--color-success)}
.stat-card:has(.stat-icon.orange)::before{background:var(--color-warning)}
.stat-card:has(.stat-icon.purple)::before{background:var(--color-primary-dark)}
.stat-card:hover{box-shadow:0 4px 16px 0 rgba(0,0,0,.1)}
.stat-icon{width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-icon.blue{background:rgba(100,149,237,.12)}
.stat-icon.green{background:rgba(103,194,58,.12)}
.stat-icon.orange{background:rgba(230,162,60,.12)}
.stat-icon.purple{background:rgba(144,107,224,.12)}
.stat-info{flex:1;min-width:0}
.stat-info .label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.stat-info .value{font-size:22px;font-weight:700;color:var(--text-primary)}
.stat-info .desc{font-size:12px;color:var(--text-secondary);margin-top:4px}
.el-table{width:100%;border-collapse:collapse;font-size:13px}
.el-table th{padding:12px 16px;text-align:left;font-weight:600;background:var(--bg-input);color:var(--text-regular);border-bottom:1px solid var(--border-color)}
.el-table td{padding:12px 16px;border-bottom:1px solid var(--border-light)}
.el-table tr:hover td{background:var(--bg-hover)}
.el-table thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 0 var(--border-color)}
.table-wrapper{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 280px)}
.el-table .group-cell{display:flex;align-items:center;gap:12px;min-height:48px}
.el-table .group-cell .g-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg-input);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px}
.el-table .group-cell .g-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.el-table .group-cell .g-info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.el-table .group-cell .g-info .g-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.el-table .group-cell .g-info .g-id{font-size:11px;color:var(--text-secondary);margin-top:1px}
.action-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--bg-card);border-top:1px solid var(--border-color);box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:20;margin-top:8px}

.btn{padding:9px 20px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-light)}
.btn-success{background:var(--color-success);color:#fff}
.btn-default{background:var(--bg-input);color:var(--text-regular);border:1px solid var(--border-color)}
.btn-default:hover{color:var(--color-primary);border-color:var(--color-primary)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:var(--radius);font-size:14px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast.success{background:var(--color-success);color:#fff}
.toast.error{background:var(--color-danger);color:#fff}
.toast.info{background:var(--color-primary);color:#fff}
.log-viewer{background:#1e1e1e;color:#d4d4d4;font-family:Consolas,Monaco,monospace;font-size:12px;padding:16px;border-radius:var(--radius);max-height:500px;overflow-y:auto;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.log-viewer .error{color:#f44747}
.log-viewer .info{color:#9cdcfe}
.log-viewer .warn{color:#ce9178}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.4}
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;transition:left .3s;z-index:100}
  .sidebar.open{left:0}
  .sidebar-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:99;display:none}
  .sidebar-overlay.open{display:block}
  .content{padding:12px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .mobile-menu-btn{display:flex!important}
}
.mobile-menu-btn{display:none}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" style="flex-direction:column;align-items:flex-start;gap:2px;">
      <div style="display:flex;align-items:center;gap:8px;width:100%;">
        <img id="botAvatar" src="" style="width:36px;height:36px;border-radius:50%;background:var(--bg-input);flex-shrink:0" alt="">
        <div style="min-width:0;flex:1;">
          <div class="logo-text" id="botName" style="font-size:14px;">加载中...</div>
          <div style="font-size:11px;color:var(--text-secondary);" id="botQQ"></div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="main">
    <header class="header">
      <button class="header-btn mobile-menu-btn" onclick="toggleSidebar()" style="border:none;background:transparent;font-size:18px;">☰</button>
      <div class="header-breadcrumb" id="breadcrumb"><span class="current">仪表盘</span></div>
      <div class="header-right">
        <span class="el-tag" id="statusTag"><span class="status-dot yellow"></span> 检测中</span>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <button class="header-btn" onclick="refreshCurrentPage()" title="重新加载当前页数据">🔄 刷新</button>
        <a class="header-btn" onclick="handleLogout()" style="cursor:pointer;">🚪 退出</a>
      </div>
    </header>
    <div class="content" id="pageContent"></div>
    <!-- 统一底部操作栏：所有需要保存的页面共用（保存按钮位置一致） -->
    <div class="action-bar" id="actionBar" style="display:none">
      <span id="actionBarTitle" style="font-size:13px;color:var(--text-secondary)"></span>
      <div style="display:flex;gap:10px;margin-left:auto">
        <button class="btn btn-success" id="actionSaveRestartBtn" style="display:none">💾 保存并重启</button>
        <button class="btn btn-primary" id="actionSaveBtn">💾 保存</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const botNum = parseInt(new URLSearchParams(location.search).get('bot') || '0', 10) || 1;
const BOT_NAME = botNum === 1 ? '依星' : '羽笙';
// 所有API请求自动带CSRF防护头
const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['X-Requested-With'] = 'XMLHttpRequest';
  return _origFetch.call(this, url, opts);
};
fetch('/api/check-auth').then(r=>r.json()).then(d=>{if(!d.authenticated)window.location.href='/'}).catch(()=>window.location.href='/');
// 加载头像、昵称、QQ号
fetch('/api/bot/' + botNum + '/info').then(r=>r.json()).then(d=>{
  if (d.success) {
    document.getElementById('botAvatar').src = 'https://q1.qlogo.cn/g?b=qq&nk=' + d.qq + '&s=640';
    document.getElementById('botName').textContent = d.name || BOT_NAME;
    document.getElementById('botQQ').textContent = 'QQ ' + d.qq;
  }
}).catch(()=>{
  document.getElementById('botName').textContent = BOT_NAME;
});

const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent = '☀️'; }

let currentPage = 'dashboard';
// 页面内容缓存：切换页面不重复加载（数据可能过期，可点顶部刷新按钮重载）
let pageCache = {};
const PAGE_CRUMBS = { dashboard:'仪表盘', manage:'运行管理', config:'插件配置', groups:'群组开关', logs:'运行日志' };
function cachePage() { pageCache[currentPage] = document.getElementById('pageContent').innerHTML; }
function refreshCurrentPage() { delete pageCache[currentPage]; renderPage(); }

// 局部更新定时器：仅刷新变化区域（状态等），不重渲染整页
let pageTimer = null;
function startPageTimer(fn, ms) { clearPageTimer(); if (fn) pageTimer = setInterval(fn, ms || 10000); }
function clearPageTimer() { if (pageTimer) { clearInterval(pageTimer); pageTimer = null; } }

// 统一底部操作栏（保存按钮固定位置）
function showActionBar(title, onSave, onSaveRestart) {
  const bar = document.getElementById('actionBar');
  const t = document.getElementById('actionBarTitle');
  const btn = document.getElementById('actionSaveBtn');
  const btn2 = document.getElementById('actionSaveRestartBtn');
  if (t) t.textContent = title || '';
  if (btn) { btn.style.display = ''; btn.onclick = onSave; }
  if (btn2) {
    if (onSaveRestart) { btn2.style.display = ''; btn2.onclick = onSaveRestart; }
    else { btn2.style.display = 'none'; btn2.onclick = null; }
  }
  if (bar) bar.style.display = 'flex';
}
function hideActionBar() {
  const bar = document.getElementById('actionBar');
  if (bar) bar.style.display = 'none';
}
// 缓存恢复时同步底部操作栏状态
function restoreActionBar() {
  if (currentPage === 'config') {
    const t = activePlugin && configPlugins[activePlugin] ? configPlugins[activePlugin] : null;
    showActionBar('正在配置：' + ((t||{}).name_cn||(activePlugin||'')),
      async () => { await saveCurrentConfig(); },
      async () => { await saveAndRestartConfig(); });
  } else if (currentPage === 'groups') {
    showActionBar('群组开关', tgSave);
  } else {
    hideActionBar();
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function showToast(msg, type) {
  type = type || 'info';
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 3000);
}
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function handleLogout() { fetch('/api/logout',{method:'POST'}).then(()=>window.location.href='/'); }

const NAV_ITEMS = [
  { id:'dashboard', icon:'📊', label:'仪表盘', group:'概览' },
  { id:'manage',    icon:'🛠️',  label:'运行管理', group:'管理' },
  { id:'config',    icon:'⚙️',  label:'插件配置', group:'管理', sub:true },
  { id:'groups',    icon:'👥',  label:'群组开关', group:'管理' },
  { id:'logs',      icon:'📋',  label:'运行日志', group:'管理' },
];

function navigate(page) {
  currentPage = page;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  renderPage();
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const groups = {};
  NAV_ITEMS.forEach(item => {
    if (!groups[item.group]) groups[item.group] = [];
    groups[item.group].push(item);
  });
  let html = '';
  for (const [g, items] of Object.entries(groups)) {
    html += '<div class="nav-group-title">' + g + '</div>';
    for (const item of items) {
      if (item.sub) {
        html += '<div class="nav-item ' + (currentPage===item.id?'active':'') + '" data-page="' + item.id + '" onclick="toggleSubMenu(\'' + item.id + '\')"><span class="icon">' + item.icon + '</span> ' + item.label + '<span class="nav-arrow" id="arrow_' + item.id + '">▾</span></div>';
        html += '<div class="nav-sub" id="sub_' + item.id + '"><div class="nav-sub-loading">加载中...</div></div>';
      } else {
        html += '<div class="nav-item ' + (currentPage===item.id?'active':'') + '" data-page="' + item.id + '" onclick="navigate(\'' + item.id + '\')"><span class="icon">' + item.icon + '</span> ' + item.label + '</div>';
      }
    }
  }
  nav.innerHTML = html;
  restoreSubMenu();
}

let configSubOpen = false;

// 展开/收起二级菜单（主项点击；页面切换由 data-page 事件委托完成）
function toggleSubMenu(id) {
  const sub = document.getElementById('sub_' + id);
  const arrow = document.getElementById('arrow_' + id);
  if (!sub) return;
  const willOpen = sub.style.display !== 'block';
  sub.style.display = willOpen ? 'block' : 'none';
  if (arrow) arrow.textContent = willOpen ? '▴' : '▾';
  if (id === 'config') {
    configSubOpen = willOpen;
    if (willOpen) ensurePluginSubmenu();
  }
}

// 恢复子菜单展开状态（renderSidebar 重渲染后调用）
function restoreSubMenu() {
  const sub = document.getElementById('sub_config');
  const arrow = document.getElementById('arrow_config');
  if (!sub) return;
  if (configSubOpen) { sub.style.display = 'block'; if (arrow) arrow.textContent = '▴'; renderPluginSubmenu(); }
  else { sub.style.display = 'none'; if (arrow) arrow.textContent = '▾'; }
}

// 确保插件列表已加载并填充二级菜单
function ensurePluginSubmenu() {
  if (Object.keys(configPlugins).length === 0) {
    fetch('/api/bot/' + botNum + '/plugins').then(r=>r.json()).then(d=>{
      configPlugins = {};
      for (const [key, val] of Object.entries(d.plugins || {})) {
        if (key !== '_toggles') configPlugins[key] = val;
      }
      configKeys = Object.keys(configPlugins);
      renderPluginSubmenu();
    }).catch(()=>{});
  } else {
    renderPluginSubmenu();
  }
}

// 渲染二级菜单插件列表
function renderPluginSubmenu() {
  const sub = document.getElementById('sub_config');
  if (!sub) return;
  const keys = Object.keys(configPlugins);
  if (keys.length === 0) { sub.innerHTML = '<div class="nav-sub-item" style="color:var(--text-secondary)">暂无插件</div>'; return; }
  sub.innerHTML = keys.map(key => {
    const p = configPlugins[key];
    return '<div class="nav-sub-item ' + (activePlugin===key?'active':'') + '" onclick="selectPlugin(\'' + key + '\')">' + (p.name_cn||key) + '</div>';
  }).join('');
}

// 从二级菜单选择插件
function selectPlugin(key) {
  activePlugin = key;
  currentPage = 'config';
  configSubOpen = true;  // 保持二级菜单展开，高亮当前插件

// === Dashboard ===
function fmtUptime(sec) {
  if (!sec || sec <= 0) return '-';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d > 0 ? d + ' 天 ' : '') + (h > 0 ? h + ' 小时 ' : '') + m + ' 分钟';
}

// === Config ===
let configPlugins = {}, configKeys = [], activePlugin = null, dirtyPlugins = {};

async function renderConfig(pluginKey) {
  document.getElementById('breadcrumb').innerHTML = '<span class="current">插件配置</span>';
  renderSidebar();
  hideActionBar();
  document.getElementById('pageContent').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)">⏳ 加载中...</div>';
  try {
    if (Object.keys(configPlugins).length === 0) {
      const r = await fetch('/api/bot/' + botNum + '/plugins');
      const d = await r.json();
      configPlugins = {};
      // 只取有插件文件存在的（排除 _toggles 元数据）
      for (const [key, val] of Object.entries(d.plugins)) {
        if (key !== '_toggles') configPlugins[key] = val;
      }
      configKeys = Object.keys(configPlugins);
      dirtyPlugins = {};
      renderPluginSubmenu();
    }
    if (configKeys.length === 0) { document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无可用配置</p></div>'; return; }
    // 插件选择已移至左侧「插件配置」二级菜单；保存按钮统一在底部操作栏
    document.getElementById('pageContent').innerHTML = '<div id="configContent"></div>';
    const target = pluginKey || (activePlugin && configPlugins[activePlugin] ? activePlugin : configKeys[0]);
    activePlugin = target;
    renderPluginSubmenu();
    switchConfigTab(target);
    cachePage();
    // 统一底部保存栏（保存/保存并重启）
    showActionBar('正在配置：' + ((configPlugins[target]||{}).name_cn||target),
      async () => { await saveCurrentConfig(); },
      async () => { await saveAndRestartConfig(); });
  } catch(e) { document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>'; }
}
function switchConfigTab(key) {
  activePlugin = key;
  document.querySelectorAll('[id^="tab_"]').forEach(el => el.className = 'btn ' + (el.id === 'tab_'+key ? 'btn-primary' : 'btn-default'));
  const plugin = configPlugins[key]; if (!plugin) return;

  // 标题：中文名 + 英文名副标题
  let html = '<div class="card"><div class="card-header"><h3>' + (plugin.name_cn||key) + '</h3><span class="badge" style="font-size:11px;padding:2px 10px;border-radius:10px;background:var(--bg-active);color:var(--color-primary)">' + (plugin.fields?plugin.fields.length:'0') + ' 项</span></div>';
  if (plugin.name_en) {
    html += '<div style="padding:0 20px 8px;font-size:12px;color:var(--text-secondary);border-bottom:1px solid var(--border-light)">' + plugin.name_en + '</div>';
  }

  if (!plugin.has_config || !plugin.fields || plugin.fields.length === 0) {
    html += '<div class="card-body"><div style="text-align:center;padding:30px;color:var(--text-secondary)">📭 该插件无可配置项</div></div></div>';
    document.getElementById('configContent').innerHTML = html;
    return;
  }

  for (const field of plugin.fields) {
    const fid = 'f_' + key + '_' + field.k;
    let inp = '';
    if (field.t === 'num') inp = '<input type="number" id="' + fid + '" value="' + field.v + '" min="' + (field.min||0) + '" max="' + (field.max||'') + '" step="' + (field.s||1) + '" style="width:120px;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none">';
    else if (field.t === 'sel' && field.o && field.o.length === 2 && field.o.includes('true')) {
      const ch = String(field.v) === 'true';
      inp = '<label class="el-switch" style="display:inline-flex;align-items:center;cursor:pointer;gap:8px"><input type="checkbox" id="' + fid + '" ' + (ch?'checked':'') + ' onchange="onCfgChange()"><span class="track" style="width:40px;height:20px;border-radius:10px;background:' + (ch?'var(--color-primary)':'var(--border-color)') + ';transition:all .2s;position:relative;display:inline-block"></span><span style="font-size:12px;color:var(--text-secondary)">' + (ch?'已开启':'已关闭') + '</span></label>';
    } else if (field.t === 'sel') {
      const opts = field.o.map(o => '<option value="' + o + '" ' + (String(o)===String(field.v)?'selected':'') + '>' + o + '</option>').join('');
      inp = '<select id="' + fid + '" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;max-width:240px">' + opts + '</select>';
    } else if (field.t === 'textlist') inp = '<textarea id="' + fid + '" placeholder="每行一个" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;resize:vertical;min-height:80px">' + (Array.isArray(field.v)?field.v.join('\n'):'') + '</textarea>';
    else if (field.t === 'password') inp = '<input type="password" id="' + fid + '" value="' + field.v + '" autocomplete="off" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none">';
    else if (field.t === 'textarea') inp = '<textarea id="' + fid + '" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;resize:vertical;min-height:120px">' + field.v + '</textarea>';
    else inp = '<input type="text" id="' + fid + '" value="' + (field.v||'') + '" style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none">';
    html += '<div class="card-body" style="border-bottom:1px solid var(--border-light);padding:14px 20px"><label style="display:block;font-size:13px;font-weight:500;margin-bottom:8px">' + field.l + '</label>' + inp + (field.hint?'<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">' + field.hint + '</div>':'') + '</div>';
  }
  html += '</div>';
  document.getElementById('configContent').innerHTML = html;
  for (const field of plugin.fields) {
    const el = document.getElementById('f_' + key + '_' + field.k);
    if (el) el.oninput = el.onchange = function() { if (!isDirty(key)) { dirtyPlugins[key]=true; } };
  }
}
function onCfgChange() { if (activePlugin && !isDirty(activePlugin)) dirtyPlugins[activePlugin] = true; }
function collectCfg(key) {
  const cfg = {}, plugin = configPlugins[key]; if (!plugin) return null;
  for (const field of plugin.fields) {
    const el = document.getElementById('f_' + key + '_' + field.k); if (!el) continue;
    if (field.t === 'num') cfg[field.k] = parseFloat(el.value);
    else if (field.t === 'textlist') cfg[field.k] = el.value.split('\n').map(s=>s.trim()).filter(s=>s);
    else if (el.type === 'checkbox') cfg[field.k] = el.checked ? 'true' : 'false';
    else cfg[field.k] = el.value;
  }
  return cfg;
}
async function saveCurrentConfig() {
  if (!activePlugin) return; const cfg = collectCfg(activePlugin); if (!cfg) return;
  showToast('💾 保存中...','info');
  try {
    const r = await fetch('/api/bot/' + botNum + '/config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plugin:activePlugin,cfg})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error||'保存失败');
    dirtyPlugins[activePlugin] = false; showToast('✅ 已保存','success'); fetchStatus();
  } catch(e) { showToast('❌ '+e.message,'error'); }
}
async function saveAndRestartConfig() {
  if (!activePlugin) return; const cfg = collectCfg(activePlugin); if (!cfg) return;
  showToast('💾 保存中...','info');
  try {
    await fetch('/api/bot/' + botNum + '/config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plugin:activePlugin,cfg})});
    showToast('✅ 已保存，正在重启...','success');
    setTimeout(async () => { await fetch('/api/bot/' + botNum + '/restart',{method:'POST'}); showToast('🔄 已重启','success'); fetchStatus(); }, 500);
  } catch(e) { showToast('❌ '+e.message,'error'); }
}

// === Groups ===
async function renderGroups() {
  hideActionBar();
  document.getElementById('breadcrumb').innerHTML = '<span class="current">群组开关</span>';
  renderSidebar();
  document.getElementById('pageContent').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)">⏳ 加载中...</div>';
  try {
    const r = await fetch('/api/bot/' + botNum + '/plugins');
    const d = await r.json();
    const tg = d.plugins._toggles;
    if (!tg || !tg.groups || !tg.groups.length) {
      document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="icon">🔀</div><p>暂无群组数据</p><div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">无法获取群列表，请确认 NapCat 运行正常</div></div>'; return;
    }

    const groups = tg.groups;
    const plugins = tg.plugins;
    const toggles = tg.toggles;

    // 初始化本地状态
    if (!window._tgState) window._tgState = {};
    for (const g of groups) {
      if (!window._tgState[g]) window._tgState[g] = {};
      for (const p of plugins) {
        window._tgState[g][p] = toggles[g] ? !!toggles[g][p] : false;
      }
    }

    let html = '<div class="card"><div class="card-header"><h3>👥 分群插件开关</h3><span class="badge" style="font-size:11px;padding:2px 10px;border-radius:10px;background:var(--bg-active);color:var(--color-primary)">' + groups.length + ' 个群</span></div>';
    html += '<div class="card-body"><div class="table-wrapper"><table class="el-table" style="min-width:600px"><thead><tr><th style="position:sticky;left:0;background:var(--bg-card);z-index:1">群号</th>';
    for (const p of plugins) {
      const meta = tg._pluginMeta && tg._pluginMeta[p] ? tg._pluginMeta[p] : null;
      html += '<th style="text-align:center;min-width:90px">' + (meta?meta.name_cn:p) + '<br><span style="font-weight:400;font-size:11px;color:var(--text-secondary)">' + (meta?meta.name_en:p) + '</span></th>';
    }
    html += '<th style="text-align:center;min-width:70px">全选</th></tr></thead><tbody>';

    // 全选行
    html += '<tr style="background:var(--bg-active)"><td style="font-weight:600">全选</td>';
    for (const p of plugins) {
      const allChecked = groups.every(g => window._tgState[g][p]);
      html += '<td style="text-align:center"><label class="el-switch"><input type="checkbox" ' + (allChecked?'checked':'') + ' class="tg-ac" data-tgp="' + p + '"><span class="track"></span></label></td>';
    }
    html += '<td style="text-align:center"><label class="el-switch"><input type="checkbox" onchange="tgToggleAll(this.checked)"><span class="track"></span></label></td></tr>';

    // 数据行（卡片式：头像+名称+群号）
    const groupInfo = tg.groupInfo || {};
    for (const g of groups) {
      const gAll = plugins.every(p => window._tgState[g][p]);
      const info = groupInfo[g] || {};
      const gName = info.name || g;
      const gAvatar = info.avatar || '';
      html += '<tr><td style="position:sticky;left:0;background:var(--bg-card)"><div class="group-cell">';
      html += '<div class="g-avatar">';
      if (gAvatar) {
        html += '<img src="' + gAvatar + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'👥\'">';
      } else {
        html += '👥';
      }
      html += '</div>';
      html += '<div class="g-info"><div class="g-name">' + escapeHtml(gName) + '</div><div class="g-id">' + g + '</div></div>';
      html += '</div></td>';
      for (const p of plugins) {
        const ch = window._tgState[g][p];
        html += '<td style="text-align:center"><label class="el-switch"><input type="checkbox" ' + (ch?'checked':'') + ' class="tg-c" data-tgg="' + g + '" data-tgp="' + p + '"><span class="track"></span></label></td>';
      }
      html += '<td style="text-align:center"><label class="el-switch"><input type="checkbox" ' + (gAll?'checked':'') + ' class="tg-r" data-tgg="' + g + '"><span class="track"></span></label></td></tr>';
    }
    html += '</tbody></table></div></div></div>';
    // 保存按钮统一在底部操作栏（与插件配置一致）；刷新用顶部栏「🔄 刷新」
    showActionBar('群组开关（' + groups.length + ' 个群 × ' + plugins.length + ' 个插件）', tgSave);
    html += '<div class="card"><div class="card-header"><h3>💡 说明</h3></div><div class="card-body" style="font-size:13px;color:var(--text-secondary);line-height:1.8">所有插件在每个群默认关闭。<br>在群内发送对应命令开启：<code>开启词库</code> / <code>关闭词库</code><br>私聊发送 = 全局控制。横向「全选」列控制单个插件在所有群的状态，纵向「全选」行控制单个群的所有插件。</div></div>';
    document.getElementById('pageContent').innerHTML = html;
    cachePage();
  } catch(e) {
    document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>';
  }
}

// 群组开关辅助函数
function tgToggle(gid, plugin, checked) {
  if (!window._tgState) return;
  if (!window._tgState[gid]) window._tgState[gid] = {};
  window._tgState[gid][plugin] = checked;
  // 同步本行全选 + 本列全选状态（不用重绘）
  var plugins = Object.keys(window._tgState[gid]);
  var rowAll = plugins.every(function(p) { return window._tgState[gid][p]; });
  var rowChk = document.querySelector('.tg-r[data-tgg="' + gid + '"]');
  if (rowChk) rowChk.checked = rowAll;
  var colAll = Object.keys(window._tgState).every(function(g) {
    return window._tgState[g] && window._tgState[g][plugin];
  });
  var colChk = document.querySelector('.tg-ac[data-tgp="' + plugin + '"]');
  if (colChk) colChk.checked = colAll;
}
function tgToggleGroup(gid, checked) {
  if (!window._tgState || !window._tgState[gid]) return;
  for (var p = 0; p < Object.keys(window._tgState[gid]).length; p++) {
    var pk = Object.keys(window._tgState[gid])[p];
    window._tgState[gid][pk] = checked;
  }
  // 更新这一行所有 checkbox
  var cbs = document.querySelectorAll('.tg-c[data-tgg="' + gid + '"]');
  for (var i = 0; i < cbs.length; i++) { cbs[i].checked = checked; }
  document.querySelector('.tg-r[data-tgg="' + gid + '"]').checked = checked;
}
function tgToggleAllPlugin(plugin, checked) {
  if (!window._tgState) return;
  for (var g = 0; g < Object.keys(window._tgState).length; g++) {
    var gid = Object.keys(window._tgState)[g];
    window._tgState[gid][plugin] = checked;
  }
  // 更新这一列所有 checkbox
  var cbs = document.querySelectorAll('.tg-c[data-tgp="' + plugin + '"]');
  for (var i = 0; i < cbs.length; i++) { cbs[i].checked = checked; }
  document.querySelector('.tg-ac[data-tgp="' + plugin + '"]').checked = checked;
}
function tgToggleAll(checked) {
  if (!window._tgState) return;
  var groups = Object.keys(window._tgState);
  for (var g = 0; g < groups.length; g++) {
    var gid = groups[g];
    var plugins = Object.keys(window._tgState[gid]);
    for (var p = 0; p < plugins.length; p++) {
      window._tgState[gid][plugins[p]] = checked;
    }
  }
  // 更新全部 checkbox
  var allCbs = document.querySelectorAll('.tg-c, .tg-r, .tg-ac');
  for (var i = 0; i < allCbs.length; i++) { allCbs[i].checked = checked; }
}
async function tgSave() {
  if (!window._tgState || !Object.keys(window._tgState).length) return;
  showToast('💾 保存群组开关...', 'info');
  try {
    const r = await fetch('/api/bot/' + botNum + '/group-toggles', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
      body: JSON.stringify({toggles: window._tgState})
    });
    const d = await r.json();
    if (d.ok) { showToast('✅ 已保存', 'success'); } 
    else { throw new Error(d.error || '保存失败'); }
  } catch(e) { showToast('❌ ' + e.message, 'error'); }
}async function renderLogs() {
  hideActionBar();
  document.getElementById('breadcrumb').innerHTML = '<span class="current">运行日志</span>';
  renderSidebar();
  document.getElementById('pageContent').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)">⏳ 加载中...</div>';
  try {
    const r = await fetch('/api/bot/' + botNum + '/screen-log');
    const d = await r.json();
    const lines = (d.log||'暂无日志').split('\n');
    let logHtml = '';
    for (const line of lines) {
      let cls = '';
      if (line.match(/error|exception|trace|失败|✗/i)) cls = 'error';
      else if (line.match(/warn/i)) cls = 'warn';
      else if (line.match(/✓|成功|启动|连接|加载/i)) cls = 'info';
      logHtml += '<div class="' + cls + '">' + escapeHtml(line) + '</div>';
    }
    document.getElementById('pageContent').innerHTML = '<div class="card"><div class="card-header"><h3>📋 运行日志</h3><span style="font-size:12px;color:var(--text-secondary)">runtime.log</span></div><div class="card-body"><div class="log-viewer">' + logHtml + '</div></div></div><button class="btn btn-default" onclick="refreshCurrentPage()">🔄 刷新</button>';
    cachePage();
  } catch(e) { document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>'; }
}

function renderPage() {
  const key = currentPage;
  clearPageTimer();  // 切换页面停止上一页的局部刷新
  if (pageCache[key] !== undefined) {
    // 命中缓存：直接恢复页面内容，不重新请求
    document.getElementById('pageContent').innerHTML = pageCache[key];
    document.getElementById('breadcrumb').innerHTML = '<span class="current">' + (PAGE_CRUMBS[key]||key) + '</span>';
    renderSidebar();
    restoreActionBar();
    return;
  }
  switch (key) {
    case 'dashboard': renderDashboard(); break;
    case 'manage':    renderManage(); break;
    case 'config':    renderConfig(); break;
    case 'groups':    renderGroups(); break;
    case 'logs':      renderLogs(); break;
    default: renderDashboard();
  }
}

fetchStatus();
renderPage();
setInterval(fetchStatus, 15000);

// 事件委托：配置标签页(data-sk)、导航(data-page)、群组开关(data-nav/checkbox)
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-sk]');
  if (el) { switchConfigTab(el.getAttribute('data-sk')); return; }
  el = e.target.closest('[data-page]');
  if (el) { navigate(el.getAttribute('data-page')); return; }
  el = e.target.closest('[data-nav]');
  if (el) {
    var act = el.getAttribute('data-nav');
    if (act === 'tgsave') { tgSave(); }
    else if (act === 'groups') { renderGroups(); }
    return;
  }
  // 全选 checkbox（class="tg-ac" 单插件全选 .tg-r 群全选 .tg-c 单个开关）
  el = e.target.closest('.tg-ac');
  if (el) { tgToggleAllPlugin(el.getAttribute('data-tgp'), el.checked); return; }
  el = e.target.closest('.tg-r');
  if (el) { tgToggleGroup(el.getAttribute('data-tgg'), el.checked); return; }
  el = e.target.closest('.tg-c');
  if (el) { tgToggle(el.getAttribute('data-tgg'), el.getAttribute('data-tgp'), el.checked); return; }
});
// 监听 checkbox change 事件（处理键盘/空格触发的切换）
document.addEventListener('change', function(e) {
  var el = e.target.closest('.tg-ac');
  if (el) { tgToggleAllPlugin(el.getAttribute('data-tgp'), el.checked); return; }
  el = e.target.closest('.tg-r');
  if (el) { tgToggleGroup(el.getAttribute('data-tgg'), el.checked); return; }
  el = e.target.closest('.tg-c');
  if (el) { tgToggle(el.getAttribute('data-tgg'), el.getAttribute('data-tgp'), el.checked); return; }
});
</script>
