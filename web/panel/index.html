<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>机器人管理面板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22%231E40AF%22 d=%22M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z%22/></svg>">
<!-- 两端共用的面板样式与外壳（与 Windows 端同一份字节，见 tests/test_dual_end_assets.py） -->
<link rel="stylesheet" href="panel.css?v=1e80e8b8">
<link rel="stylesheet" href="cfg_form.css?v=64b4e908">
</head>
<body>
<script src="cfg_form.js?v=9c545ed8"></script>
<script src="panel.js?v=c20808fa"></script>
<script>
/* ==========================================================================
   Linux 机器人面板：这里**只声明"接口在哪"和"显示哪些页"**。
   界面（骨架/导航/交互）全在共用的 panel.js，页面内容全在后端 web/ui_pages.py。
   ========================================================================== */
const botNum = parseInt(new URLSearchParams(location.search).get('bot') || '0', 10) || 1;
const BOT_NAME_HINT = botNum === 1 ? '依星' : '羽笙';
const BASE = '/api/bot/' + botNum;

/* 写操作要带 CSRF 防护头（面板后端要求） */
const _rawFetch = window.fetch;
window.fetch = function (url, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['X-Requested-With'] = 'XMLHttpRequest';
  return _rawFetch.call(this, url, opts);
};
function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}
fetch('/api/check-auth').then(function (r) { return r.json(); })
  .then(function (d) { if (!d.authenticated) location.href = '/'; })
  .catch(function () { location.href = '/'; });

PANEL.endpoints = {
  page: function (p) {
    return BASE + '/ui/page/' + p + (p === 'config' && PANEL.key ? '?plugin=' + encodeURIComponent(PANEL.key) : '');
  },
  headerStatus: function () { return BASE + '/status'; },
  status: function () { return BASE + '/ui/status'; },
  plugins: function () { return BASE + '/plugins'; },
  schema: function (k) { return BASE + '/plugins/' + encodeURIComponent(k) + '/schema'; },
  saveConfig: function (k, cfg, raw) { return post(BASE + '/config' + (raw ? '?raw=1' : ''), { plugin: k, cfg: cfg, raw: raw }); },
  logs: function (sfx, lines) { return BASE + (sfx === '2' ? '/napcat-log' : '/log') + '?lines=' + lines; },
  saveToggles: function (t) { return post(BASE + '/group-toggles', { toggles: t }); },
  qr: function () { return BASE + '/napcat-qr'; }
};

/* 与 Windows 端同一套导航结构（那边多一个「账号」页，此处确实用不到） */

/* 「插件配置」的图标：数据库 + 右下角压一个小齿轮（齿轮用外壳里 i-settings 的矢量，
   外面套一个与侧栏同色的实心圆，盖住下面的数据库线条，做出"徽标盖上去"的效果） */
const NAV_ICON_PLUGINS =
  '<svg class="ico nav-ico-db" viewBox="0 0 24 24" aria-hidden="true" focusable="false"'
  + ' fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
  +   '<ellipse cx="10.2" cy="5.6" rx="6.2" ry="2.6"/>'
  +   '<path d="M4 5.6v11.4c0 1.44 2.78 2.6 6.2 2.6 1.28 0 2.47-.17 3.44-.46"/>'
  +   '<path d="M4 11.4c0 1.44 2.78 2.6 6.2 2.6 1.05 0 2.04-.11 2.9-.31"/>'
  +   '<path d="M16.4 5.9v5.2"/>'
  +   '<circle cx="17.6" cy="17.6" r="5.6" fill="var(--bg-sidebar)" stroke="none"/>'
  +   '<use href="#i-settings" x="13" y="13" width="9.2" height="9.2" stroke-width="3.4"/>'
  + '</svg>';

PANEL.nav = [
  { id: 'dashboard', icon: '📊', label: '仪表盘', group: '概览' },
  { id: 'manage', icon: '🛠️', label: '运行管理', group: '管理' },
  { id: 'config', icon: NAV_ICON_PLUGINS, label: '插件配置', group: '管理', sub: true },
  { id: 'groups', icon: '👥', label: '群组开关', group: '管理' },
  { id: 'logs', icon: '📋', label: '运行日志', group: '管理', sub: true, ids: ['napcat_logs'] }
];

/* 左下角「设置」齿轮里放什么（Windows 端放的是"更新/设置/引导"三个页面；
   Linux 这边：设置页 + 三个动作型菜单项，共用外壳会按 id 找页面、或直接执行 run()） */
PANEL.appMenu = [
  { id: 'settings', icon: '⚙️', label: '设置' },
  { id: 'switch-bot', icon: '🔀', label: '切换机器人', run: function () { location.href = '/'; } },
  { id: 'open-napcat', icon: '🖥️', label: '打开 NapCat 面板', run: function () {
      PANEL.api('/api/bot/' + botNum + '/napcat-status').then(function (d) {
        const url = (d && (d.webui || (d.data && d.data.webui))) || '';
        if (url) window.open(url, '_blank', 'noopener');
        else PANEL.toast('该实例没有配置 NapCat 面板地址（注册文件的 INST_NAPCAT_WEBUI）', 'error');
      }).catch(function (e) { PANEL.toast('打开失败：' + (e && e.message || e), 'error'); });
  } },
  { id: 'logout', icon: '🚪', label: '退出登录', run: function () { PANEL.hooks.logout(); } }
];

/* 群列表（给 cfg_form.js 的群号选择器用）：从群组页片段里取，拿不到就退化成手填 */
let _groupsCache = null, _groupsErr = '';
PANEL.hooks = {
  identity: async function () {
    const d = await PANEL.api(BASE + '/info');
    if (!d.success) return;
    PANEL.$('botAvatar').src = 'https://q1.qlogo.cn/g?b=qq&nk=' + d.qq + '&s=640';
    PANEL.$('botName').textContent = d.name || BOT_NAME_HINT;
    PANEL.$('botSub').textContent = 'QQ ' + d.qq;
    document.title = (d.name || BOT_NAME_HINT) + ' - 管理面板';
    const icon = document.querySelector('link[rel="icon"]');
    if (icon) icon.href = 'https://q1.qlogo.cn/g?b=qq&nk=' + d.qq + '&s=640';
  },
  logout: function () { post('/api/logout').then(function () { location.href = '/'; }); },
  /* 左上角账号卡（侧栏展开时点头像）→ 向右弹出实例列表，点哪个切哪个。
     桌面端靠这个浮层切账号，Linux 端原来没给 hook → 点头像没反应（只会"展开侧栏"）。 */
  accountPop: async function (pop) {
    let bots = [];
    try { const d = await PANEL.api('/api/bots'); bots = (d && d.bots) || []; } catch (e) { bots = []; }
    if (!bots.length) {
      pop.innerHTML = '<div class="acct-pop-title">切换机器人</div>'
        + '<div class="nav-sub-loading">没有可用的实例</div>';
      return;
    }
    pop.innerHTML = '<div class="acct-pop-title">切换机器人</div>' + bots.map(function (b) {
      const qq = String(b.qq || b.num);
      const active = Number(qq) === botNum;
      return '<div class="acct-row ' + (active ? 'active' : '') + '" role="button" tabindex="0"'
        + ' data-acct-pick="' + PANEL.esc(qq) + '">'
        + '<span class="status-dot ' + (b.running ? 'green' : 'red') + '"></span>'
        + '<span style="min-width:0;flex:1"><span class="a-name">' + PANEL.esc(b.name || ('Bot_' + qq)) + '</span>'
        + '<div class="a-sub">QQ ' + PANEL.esc(qq) + (active ? ' · 当前' : '') + '</div></span></div>';
    }).join('');
  },
  pickAccount: function (key) { location.href = '/panel/?bot=' + encodeURIComponent(key); },
  subMenus: {
    config: function (sub) { renderPluginList(sub); },
    logs: function (sub) {
      function item(id, label) {
        const active = PANEL.page === id;
        return '<div class="nav-sub-item ' + (active ? 'active' : '') + '" role="button" tabindex="0"'
          + (active ? ' aria-current="page"' : '') + ' onclick="PANEL.openPage(\'' + id + '\')">' + label + '</div>';
      }
      sub.innerHTML = item('logs', '📄 项目日志') + item('napcat_logs', '🐱 NapCat 日志');
    }
  },
  mounted: {
    dashboard: function () { PANEL.startPoll(PANEL.refreshStatusParts, 10000); },
    manage: function () { PANEL.startPoll(PANEL.refreshStatusParts, 10000); },
    groups: function () { PANEL.readGroupsState('groupsState'); },
    logs: function () {
      PANEL.syncLogState('');
      PANEL.loadLogs('');
      if (PANEL.logState('').auto) PANEL.startPoll(function () { PANEL.loadLogs(''); }, 5000);
    },
    napcat_logs: function () {
      PANEL.syncLogState('2');
      PANEL.loadLogs('2');
      if (PANEL.logState('2').auto) PANEL.startPoll(function () { PANEL.loadLogs('2'); }, 5000);
    },
    config: function () {
      /* 直接点导航「插件配置」（不带 key）时自动选第一个插件：
         否则会停在"没有可配置的插件"，看着像坏了 */
      if (!PANEL.key) PANEL.key = Object.keys(configPlugins)[0] || null;
      PANEL.renderConfigForm(PANEL.key);
      if (!Object.keys(configPlugins).length) {
        loadPlugins().then(function () {
          if (PANEL.page !== 'config' || PANEL.key) return;
          PANEL.key = Object.keys(configPlugins)[0] || null;
          if (PANEL.key) PANEL.renderConfigForm(PANEL.key);
        });
      }
    },
    settings: function () { bindSettingsInputs(); }
  },
  save: {
    config: function (btn) { PANEL.saveConfig(btn, false); },
    groups: function (btn) { PANEL.tgSave(btn); },
    settings: function (btn) { PANEL.saveSettings(btn); }
  },
  saveRestart: function (btn) { PANEL.saveConfig(btn, true); },
  restart: function () { return post(BASE + '/restart'); },
  actions: {
    start: function () { return post(BASE + '/start'); },
    stop: function () { return post(BASE + '/stop'); },
    restart: function () { return post(BASE + '/restart'); },
    'napcat-restart': function () { return post(BASE + '/napcat-restart'); }
  },
  loadGroups: async function (force) {
    if (_groupsCache && !force) return _groupsCache;
    try {
      const d = await PANEL.api(BASE + '/ui/page/groups');
      const html = (d.data || {}).html || '';
      const ids = Array.from(html.matchAll(/data-tgg="(\d+)"/g)).map(function (m) { return m[1]; });
      const names = Array.from(html.matchAll(/<div class="g-name">([^<]*)<\/div>/g)).map(function (m) { return m[1]; });
      _groupsCache = Array.from(new Set(ids)).map(function (id) { return { group_id: id, group_name: names[ids.indexOf(id)] || '' }; });
      _groupsErr = '';
    } catch (e) { _groupsCache = []; _groupsErr = (e.message || '接口不可用'); }
    if (force) {
      PANEL.renderConfigForm(PANEL.key);
      PANEL.toast('已刷新群列表（' + (_groupsCache || []).length + ' 个）', 'success');
    }
    return _groupsCache;
  },
  groupSelect: function () { return { groups: _groupsCache || [], error: _groupsErr }; }
};

/* 插件二级菜单：名字来自后端插件元数据，未保存的插件带圆点 */
let configPlugins = {};
function renderPluginList(sub) {
  const keys = Object.keys(configPlugins);
  if (!keys.length) { sub.innerHTML = '<div class="nav-sub-loading">加载中...</div>'; return loadPlugins(); }
  sub.innerHTML = keys.map(function (k) {
    const p = configPlugins[k], active = PANEL.key === k && PANEL.page === 'config';
    /* 展开后的每个插件统一用「@」图标（has-icon 是外壳里现成的行样式） */
    return '<div class="nav-sub-item has-icon ' + (active ? 'active' : '') + '" role="button" tabindex="0"'
      + (active ? ' aria-current="page"' : '') + ' onclick="PANEL.openPage(\'config\',\'' + k + '\')">'
      + '<span class="icon at-ico" aria-hidden="true" style="font-size:13px;font-weight:700;line-height:1">@</span>'
      + '<span class="nav-sub-label">' + PANEL.esc(p.name_cn || k) + '</span>'
      + (PANEL.dirty[k] ? '<span class="unsaved-dot" title="有未保存的修改"></span>' : '') + '</div>';
  }).join('');
}
function loadPlugins() {
  return PANEL.api(PANEL.endpoints.plugins()).then(function (d) {
    configPlugins = {};
    Object.keys(d.plugins || {}).forEach(function (k) { if (k !== '_toggles') configPlugins[k] = d.plugins[k]; });
    const sub = PANEL.$('sub_config');
    if (sub) renderPluginList(sub);
    return configPlugins;
  }).catch(function () {
    const sub = PANEL.$('sub_config');
    if (sub) sub.innerHTML = '<div class="nav-sub-item" style="color:var(--color-danger)">加载失败，展开菜单可重试</div>';
  });
}

/* ---------------- 设置页（主人 QQ / 管理员 QQ） ---------------- */
/* 输入框 → 脏值标记（切页/刷新前会拦一下，与插件配置/群组开关同一套保护） */
function bindSettingsInputs() {
  ['setMasterQQ', 'setAdmins'].forEach(function (id) {
    const el = PANEL.$(id);
    if (!el || el._bound) return;
    el._bound = true;
    el.addEventListener('input', function () { if (PANEL.markSettingsDirty) PANEL.markSettingsDirty(); });
  });
}

/* 一行一个 / 逗号 / 空格 / 顿号 都能拆；前端先粗筛，服务端还会再校验一次 */
function splitQQList(text) {
  const parts = String(text || '').replace(/[，、;；\n\r\t]/g, ',').split(/[,\s]+/);
  const out = [];
  parts.forEach(function (p) {
    const v = p.trim();
    if (v && out.indexOf(v) < 0) out.push(v);
  });
  return out;
}

PANEL.saveSettings = async function (btn) {
  const masterEl = PANEL.$('setMasterQQ');
  const adminsEl = PANEL.$('setAdmins');
  if (!masterEl) return;
  const master = splitQQList(masterEl.value);
  const admins = splitQQList(adminsEl ? adminsEl.value : '');
  if (!master.length) { PANEL.toast('主人 QQ 至少填一个', 'error'); masterEl.focus(); return; }
  const bad = master.concat(admins).filter(function (q) { return !/^\d{5,12}$/.test(q); });
  if (bad.length) {
    PANEL.toast('不是合法 QQ 号：' + bad.slice(0, 3).join('、') + (bad.length > 3 ? '…' : ''), 'error');
    return;
  }
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '保存中…'; }
  try {
    const d = await PANEL.api(BASE + '/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ master: master, admins: admins })
    });
    if (!d || !d.ok) {
      const fe = (d && d.field_errors) || {};
      const first = Object.keys(fe)[0];
      throw new Error((first ? fe[first] : '') || (d && d.error) || '保存失败');
    }
    PANEL.clearDirty();
    PANEL.toast(d.msg || '设置已保存', 'success');
    PANEL.goPage('settings');          /* 重新拉一次片段：确认落盘后的值 */
  } catch (e) {
    PANEL.toast('保存失败：' + ((e && e.message) || e), 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }
};

PANEL.start();
</script>
<script>
/* 兜底：共用外壳没加载成功时页面会是一片空白 —— 与其留白，不如说清楚怎么修。
   （2026-10-10 真踩过：nginx 缺 mime.types → panel.js 以 application/octet-stream
     下发 → 浏览器拒绝执行 → 远程访问空白页，而本机直连一切正常。） */
window.addEventListener('load', function () {
  if (window.PANEL) return;
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="margin:16px;padding:14px 18px;border:1px solid #B91C1C;border-radius:10px;'
    + 'background:#FEF2F2;color:#B91C1C;font:14px/1.7 system-ui;max-width:760px">'
    + '<b>面板外壳 panel.js 没有加载成功</b>，所以页面是空的。<br>'
    + '1) 先按 <b>Ctrl+F5</b> 强制刷新（多半是缓存了旧的错误响应）；<br>'
    + '2) 仍不行：开发者工具里看 <code>/panel/panel.js</code> 的状态与 '
    + '<code>Content-Type</code>（必须是 javascript，不能是 octet-stream）；<br>'
    + '3) 服务端自检：<code>curl -I https://你的域名/panel/panel.js</code>。</div>');
});
</script>
</body>
</html>
